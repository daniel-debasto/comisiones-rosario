<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Comisión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 40px; }
        .navbar { background-color: #0f172a; color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .btn-volver { color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 0.95rem; }
        .container { max-width: 560px; margin: 0 auto; padding: 16px; }
        .form-card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); }
        .campo { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
        input[type="text"], input[type="number"], input[type="time"], select, textarea {
            width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 1rem; background: #f8fafc;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6; background: white; }
        .check-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
        .check-row input { width: 22px; height: 22px; }
        .btn-guardar { width: 100%; background: #16a34a; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1.05rem; font-weight: 800; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="{% url 'hoja_de_ruta' %}" class="btn-volver">← Volver</a>
    <span style="font-weight: 700;">Nueva Comisión</span>
    <span style="width: 50px;"></span>
</nav>

<div class="container">
    <form method="POST" class="form-card">
        {% csrf_token %}

        <div class="campo">
            <label>👤 Cliente (escribí o elegí uno)</label>
            <input type="text" name="cliente_nombre" list="lista-clientes" placeholder="Ej: Estudio Pérez" required>
            <datalist id="lista-clientes">
                {% for c in clientes %}
                    <option value="{{ c.nombre }}">
                {% endfor %}
            </datalist>
        </div>

        <div class="campo">
            <label>📍 Dirección en Rosario</label>
            <input type="text" name="direccion_entrega" placeholder="Ej: Córdoba 1450" required>
        </div>

        <div class="campo">
            <label>🗺️ Zona</label>
            <select name="zona">
                <option value="">-- Seleccionar zona --</option>
                {% for z in zonas %}
                    <option value="{{ z.id }}">{{ z.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="campo">
                <label>⏰ Hora límite (opcional)</label>
                <input type="time" name="hora_limite">
            </div>
            <div class="campo">
                <label>📦 Tipo</label>
                <select name="tipo">
                    <option value="SOBRE">Sobre / Doc.</option>
                    <option value="BULTO">Paquete / Carga</option>
                    <option value="TRAMITE">Trámite</option>
                </select>
            </div>
        </div>

        <div class="campo">
            <label>💲 Monto del envío ($)</label>
            <input type="number" name="monto" placeholder="0" step="100">
        </div>

        <div class="check-row">
            <input type="checkbox" name="pagado" id="pagado">
            <label for="pagado" style="margin: 0; font-size: 0.95rem; color: #0f172a;">Ya está pagado</label>
        </div>

        <div class="campo">
            <label>📝 Notas / Aclaraciones</label>
            <textarea name="notas" rows="2" placeholder="Ej: Preguntar por Laura en recepción"></textarea>
        </div>

        <button type="submit" class="btn-guardar">💾 Guardar en Hoja de Ruta</button>
    </form>
</div>

</body>
</html>
